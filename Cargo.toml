[package]
name = "lib-respect"
version = "0.1.0"
edition = "2024"
description = "Discover the GitHub repositories behind Rust dependencies and see which you have starred"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
dirs = "7"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
toml = "1.1"
url = "2.5"
ureq = "3.4"
open = "5"
